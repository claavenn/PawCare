services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pawcare-app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-pawcare_password}
      DB_NAME: ${DB_NAME:-pawcare_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pawcare-network

  db:
    image: mysql:8.0
    container_name: pawcare-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-pawcare_password}
      MYSQL_DATABASE: ${DB_NAME:-pawcare_db}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - pawcare-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-pawcare_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer:
    image: adminer:latest
    container_name: pawcare-adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - pawcare-network
    profiles:
      - tools

volumes:
  db_data:

networks:
  pawcare-network:
    driver: bridge