version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pawcare
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: pawcare_password
      DB_NAME: pawcare_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pawcare-network

  db:
    image: mysql:8.0
    container_name: pawcare-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: pawcare_password
      MYSQL_DATABASE: pawcare_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - pawcare-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppawcare_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:

networks:
  pawcare-network:
    driver: bridge